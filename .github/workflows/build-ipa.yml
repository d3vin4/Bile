name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build Rust core
        run: |
          chmod +x build-ios.sh build-ipa.sh
          echo "HOME=$HOME"; echo "PATH=$PATH"; which cargo rustc rustup || true; ls -la "$HOME/.cargo/bin" 2>/dev/null || true; cat "$HOME/.cargo/env" 2>/dev/null || true
          bash -x ./build-ios.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build IPA
        run: ./build-ipa.sh Release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Readipa-ipa
          path: build/Readipa.ipa

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: build/Readipa.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
