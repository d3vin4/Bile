name: Readipa
options:
  bundleIdPrefix: com.d3vin4
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Readipa:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
      - target: PairingLiveActivityExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: "Readipa"
        PRODUCT_BUNDLE_IDENTIFIER: com.d3vin4.readipa
        INFOPLIST_FILE: ios-app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
        NSSupportsLiveActivities: YES

  PairingLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PairingLiveActivity
      - path: ios-app/PairingActivityAttributes.swift
    settings:
      base:
        PRODUCT_NAME: "PairingLiveActivity"
        PRODUCT_BUNDLE_IDENTIFIER: com.d3vin4.readipa.pairingliveactivity
        INFOPLIST_FILE: PairingLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: PairingLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: "Pairing Live Activity"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Readipa:
    build:
      targets:
        Readipa: all
        PairingLiveActivityExtension: all
    test:
      targets: []
