name: Readipa
options:
  bundleIdPrefix: com.d3vin4
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Liquid Glass: the iOS 26 SDK opts in by default. Stated explicitly so the
    # intent survives future toolchain changes.
    UIDesignRequiresCompatibility: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Readipa:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    settings:
      base:
        PRODUCT_NAME: "Readipa"
        PRODUCT_BUNDLE_IDENTIFIER: com.d3vin4.readipa
        INFOPLIST_FILE: ios-app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # zlib for ZIP (de)compression inside the file manager.
        OTHER_LDFLAGS: "-lz"
        GENERATE_INFOPLIST_FILE: NO
        UIDesignRequiresCompatibility: NO

schemes:
  Readipa:
    build:
      targets:
        Readipa: all
    test:
      targets: []
